[package]
name = "aing"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Own your React components. Install, merge and discover them through MCP."

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
diffy = "=0.5.2"
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_span = "=0.155.0"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread"] }
ureq = { version = "=3.4.2", features = ["json"] }

[build-dependencies]
serde_json = "=1.0.154"

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = 0
incremental = false
